name: Update profile stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate stats cards
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          # A classic PAT with `read:user` scope is required for full lifetime
          # stats (private contribution counts, multi-year history). See
          # SETUP.md. Falls back to GITHUB_TOKEN for public-only data.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run stats

      - name: Generate views badge
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run views
        continue-on-error: true # traffic API needs push access to this repo

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/
          git diff --cached --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
